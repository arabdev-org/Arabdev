[project]
name = "arabdev-backend"
version = "1.0.0"
description = "ArabDev — REST API for the ArabDev developer community"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.18",
    "pillow>=11.0",
    "nh3>=0.2.18",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx2>=2.13"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
