<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ArabDev — مجتمع للمطورين العرب: انشر، ناقش، وتابع مطورين يشاركونك الاهتمامات." />
    <meta name="theme-color" content="#D0152B" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" href="/fonts/tajawal/tajawal-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/anton/anton-400.woff2" as="font" type="font/woff2" crossorigin />
    <title>ArabDev</title>
    <script>
      // Apply the saved language and color scheme before the first paint (no flash).
      (function () {
        try {
          var lang = localStorage.getItem('arabdev.lang') === 'en' ? 'en' : 'ar';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          var mode = localStorage.getItem('arabdev.mode') || 'system';
          var dark = mode === 'dark' || (mode === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-mui-color-scheme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
